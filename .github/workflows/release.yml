name: Build and release Check Update
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test without changing installed apps
        shell: pwsh
        run: ./test.ps1 -Offline
      - name: Prepare portable release
        shell: pwsh
        run: |
          ./build.ps1
          Copy-Item -LiteralPath 'dist/Check Update.exe' -Destination 'dist/Check-Update.exe'
          $hash = (Get-FileHash -LiteralPath 'dist/Check-Update.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/Check-Update.exe.sha256'), "$hash  Check-Update.exe`n", [Text.Encoding]::ASCII)
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $PWD 'dist/Check-Update.exe')).Version
            if ($env:GITHUB_REF_NAME -ne ('v' + $version.ToString(3))) { throw 'Tag does not match executable version' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Check-Update-Windows
          path: |
            dist/Check-Update.exe
            dist/Check-Update.exe.sha256
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Check-Update-Windows
          path: release
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG 'release/Check-Update.exe' 'release/Check-Update.exe.sha256' --verify-tag --title "Check Update $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
