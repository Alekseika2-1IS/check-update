name: Build and test Check Update
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test without changing installed apps
        shell: pwsh
        run: ./test.ps1 -Offline
      - name: Test per-user installation and uninstallation
        shell: pwsh
        run: ./test-installer.ps1
      - name: Prepare unsigned build for inspection
        shell: pwsh
        run: |
          ./build-installer.ps1
          Copy-Item -LiteralPath 'dist/Check Update.exe' -Destination 'dist/Check-Update.exe'
          $hash = (Get-FileHash -LiteralPath 'dist/Check-Update.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/Check-Update.exe.sha256'), "$hash  Check-Update.exe`n", [Text.Encoding]::ASCII)
          $setupHash = (Get-FileHash -LiteralPath 'dist/Check-Update-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/Check-Update-Setup.exe.sha256'), "$setupHash  Check-Update-Setup.exe`n", [Text.Encoding]::ASCII)
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $PWD 'dist/Check-Update.exe')).Version
            if ($env:GITHUB_REF_NAME -ne ('v' + $version.ToString(3))) { throw 'Tag does not match executable version' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Check-Update-Windows-Unsigned
          path: |
            dist/Check-Update.exe
            dist/Check-Update.exe.sha256
            dist/Check-Update-Setup.exe
            dist/Check-Update-Setup.exe.sha256
